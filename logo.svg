<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" role="img" aria-labelledby="musebot-title">
  <title id="musebot-title">Musebot</title>

  <defs>
    <!-- Dark disc, lit from above and slightly right. Axis and endpoint
         colours are the least-squares fit of the original artwork. -->
    <linearGradient id="g-disc" gradientUnits="userSpaceOnUse" x1="613.84" y1="219.2" x2="410.16" y2="804.8">
      <stop offset="0" stop-color="#465373"/>
      <stop offset="0.5" stop-color="#364059"/>
      <stop offset="1" stop-color="#262C3E"/>
    </linearGradient>

    <!-- Contact shadow cast by the face onto the disc. -->
    <radialGradient id="g-shadow">
      <stop offset="0.86" stop-color="#0B0E18" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0B0E18" stop-opacity="0"/>
    </radialGradient>

    <!-- objectBoundingBox so the gradient follows each <use> instance. -->
    <linearGradient id="g-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42507A"/>
      <stop offset="0.55" stop-color="#333F5E"/>
      <stop offset="1" stop-color="#2E3856"/>
    </linearGradient>
    <!-- Falloff sampled from the original: -13.5 at the pupil rim decaying
         to zero by 2.75 pupil radii, a far softer tail than a plain
         two-stop gradient produces. -->
    <radialGradient id="g-pupil-shadow">
      <stop offset="0.4" stop-color="#151A28" stop-opacity="0.37"/>
      <stop offset="0.46" stop-color="#151A28" stop-opacity="0.3"/>
      <stop offset="0.52" stop-color="#151A28" stop-opacity="0.23"/>
      <stop offset="0.58" stop-color="#151A28" stop-opacity="0.16"/>
      <stop offset="0.64" stop-color="#151A28" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#151A28" stop-opacity="0.07"/>
      <stop offset="0.76" stop-color="#151A28" stop-opacity="0.04"/>
      <stop offset="0.82" stop-color="#151A28" stop-opacity="0.02"/>
      <stop offset="0.88" stop-color="#151A28" stop-opacity="0.01"/>
      <stop offset="0.94" stop-color="#151A28" stop-opacity="0.01"/>
      <stop offset="1" stop-color="#151A28" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g-antenna" gradientUnits="userSpaceOnUse" x1="0" y1="237" x2="0" y2="397">
      <stop offset="0" stop-color="#75DAFC"/>
      <stop offset="1" stop-color="#5588F9"/>
